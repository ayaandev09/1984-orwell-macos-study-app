<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Cyan Neon Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="cyanAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Party Red Surveillance Gradients -->
    <linearGradient id="partyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="75%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Pyramidal Minitrue Gradients -->
    <linearGradient id="pyramidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Ambient Surveillance Radial Aura -->
  <circle cx="256" cy="256" r="240" fill="url(#cyanAura)"/>

  <!-- Outer Glass Rim & Telescreen Coordinates Ring -->
  <circle cx="256" cy="256" r="230" fill="#0b1322" stroke="url(#cyanGrad)" stroke-width="8" stroke-opacity="0.9"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8" stroke-opacity="0.6"/>

  <!-- Brutalist Minitrue Spire Base -->
  <polygon points="256,76 394,374 118,374" fill="url(#pyramidGrad)" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.5"/>
  <line x1="256" y1="76" x2="256" y2="374" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Radar Reticle Cardinal Alignment Markers -->
  <line x1="256" y1="36" x2="256" y2="76" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="436" x2="256" y2="476" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="36" y1="256" x2="76" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="436" y1="256" x2="476" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>

  <!-- The All-Seeing Telescreen Eye -->
  <!-- Outer Almond Contour (Thick High-Contrast Neon Stroke) -->
  <path
    d="M 96 256 C 160 148, 352 148, 416 256 C 352 364, 160 364, 96 256 Z"
    fill="#070e1b"
    stroke="url(#cyanGrad)"
    stroke-width="14"
    stroke-linejoin="round"
  />

  <!-- Sclera Aperture Secondary Trace -->
  <path
    d="M 132 256 C 180 182, 332 182, 380 256 C 332 330, 180 330, 132 256 Z"
    fill="none"
    stroke="#0284c7"
    stroke-width="3"
    stroke-dasharray="6 6"
    stroke-opacity="0.8"
  />

  <!-- Glowing Crimson / Big Brother Surveillance Iris -->
  <circle cx="256" cy="256" r="68" fill="url(#partyRed)" stroke="#fee2e2" stroke-width="3.5"/>
  <circle cx="256" cy="256" r="56" fill="none" stroke="#fecaca" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.7"/>

  <!-- Central Surveillance Aperture Pupil -->
  <circle cx="256" cy="256" r="32" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="256" cy="256" r="14" fill="#38bdf8"/>

  <!-- Dual Specular Glints (Instant Human Eye Readability) -->
  <circle cx="270" cy="242" r="8" fill="#ffffff"/>
  <circle cx="244" cy="268" r="3.5" fill="#ffffff" fill-opacity="0.85"/>

  <!-- Concentric Scanning Orbit -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 14" stroke-opacity="0.5"/>
</svg>
